[phases.setup]
nixPkgs = ["python3", "nodejs", "git", "curl", "libopus", "libffi", "ffmpeg"]

[phases.build]
cmds = [
  "git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil-ytdlp-pot-provider",
  "cd bgutil-ytdlp-pot-provider/server && npm ci && npx tsc"
]

[start]
cmd = "sh -c 'set -e; node bgutil-ytdlp-pot-provider/server/build/main.js --host 127.0.0.1 --port 4416 > /tmp/bgutil.log 2>&1 & BGUTIL_PID=$!; for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then echo \"[BGUTIL] POT provider ready on 127.0.0.1:4416\"; break; fi; if ! kill -0 $BGUTIL_PID 2>/dev/null; then echo \"[BGUTIL] provider exited during startup\"; cat /tmp/bgutil.log || true; break; fi; sleep 1; done; python main.py'"
