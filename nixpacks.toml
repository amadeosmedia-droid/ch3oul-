[phases.setup]
nixPkgs = ["python3", "nodejs", "git", "libopus", "libffi", "ffmpeg"]

[phases.build]
cmds = [
  "git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil-ytdlp-pot-provider",
  "cd bgutil-ytdlp-pot-provider/server && npm ci && npx tsc"
]

[start]
cmd = "node bgutil-ytdlp-pot-provider/server/build/main.js --host 127.0.0.1 --port 4416 & sleep 2 && python main.py"
